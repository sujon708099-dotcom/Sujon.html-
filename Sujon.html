<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SM Viral Link</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0b0c20;
    color:#fff;
    font-family:Arial,sans-serif;
    padding-bottom:90px;
}

/* HEADER */
.header{
    padding:20px;
    text-align:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.sub{
    color:#9294aa;
    font-size:13px;
    margin-top:5px;
}

/* SEARCH */
.search{
    margin:5px 18px 15px;
    background:#1a1b31;
    border:1px solid #2c2d46;
    border-radius:16px;
    padding:14px;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-size:15px;
}

/* CATEGORY */
.categories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:5px 18px 18px;
}

.category{
    flex:none;
    background:#1a1b31;
    border:1px solid #2b2c45;
    padding:10px 18px;
    border-radius:30px;
    font-size:14px;
}

.category.active{
    background:linear-gradient(90deg,#9b3cff,#ed349a);
    border:0;
}

/* VIDEO CARD */
.video-card{
    margin:0 18px 20px;
    background:#17182c;
    border:1px solid #292a43;
    border-radius:20px;
    overflow:hidden;
}

.thumbnail{
    position:relative;
    width:100%;
    height:210px;
    background:#25263b;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:62px;
    height:62px;
    border-radius:50%;
    background:#ffffffdd;
    color:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
}

.video-info{
    padding:16px;
}

.video-title{
    font-size:17px;
    font-weight:bold;
    line-height:1.5;
}

.video-meta{
    color:#8e90a5;
    font-size:12px;
    margin-top:8px;
}

.action{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.btn{
    flex:1;
    border:0;
    padding:13px;
    border-radius:13px;
    color:white;
    font-weight:bold;
}

.watch{
    background:linear-gradient(90deg,#9c3dff,#e83298);
}

.download{
    background:#292a40;
}

/* BOTTOM */
.bottom{
    position:fixed;
    bottom:10px;
    left:15px;
    right:15px;
    height:65px;
    background:#191a30;
    border:1px solid #303149;
    border-radius:22px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:50;
}

.nav{
    text-align:center;
    color:#85879c;
    font-size:12px;
}

.nav span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav.active{
    color:#ef3aa0;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000c;
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:430px;
    background:#18192d;
    border-radius:20px;
    padding:18px;
}

.modal video{
    width:100%;
    border-radius:14px;
    background:#000;
}

.close{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:#303149;
    color:white;
}

/* EMPTY */
.empty{
    text-align:center;
    color:#77798d;
    padding:40px 20px;
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">🎬 SM Viral Link</div>
    <div class="sub">Latest videos in one place</div>
</header>

<!-- SEARCH -->
<div class="search">
    <input
        id="search"
        type="text"
        placeholder="🔍 ভিডিও খুঁজুন..."
        oninput="searchVideos()">
</div>

<!-- CATEGORY -->
<div class="categories">
    <div class="category active"
         onclick="filterCategory('All',this)">
        All
    </div>

    <div class="category"
         onclick="filterCategory('Viral',this)">
        🔥 Viral
    </div>

    <div class="category"
         onclick="filterCategory('TikTok',this)">
        🎵 TikTok
    </div>

    <div class="category"
         onclick="filterCategory('Funny',this)">
        😂 Funny
    </div>
</div>

<!-- VIDEO LIST -->
<div id="videoList"></div>

<!-- VIDEO MODAL -->
<div class="modal" id="videoModal">

    <div class="modal-box">

        <video id="player"
               controls
               playsinline>
        </video>

        <button class="close"
                onclick="closeVideo()">
            ✕ Close
        </button>

    </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom">

    <div class="nav active">
        <span>🏠</span>
        Home
    </div>

    <div class="nav">
        <span>🔥</span>
        Trending
    </div>

    <div class="nav">
        <span>❤️</span>
        Favorite
    </div>

    <div class="nav">
        <span>👤</span>
        Profile
    </div>

</div>

<script>

/* TELEGRAM */
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/*
========================================
DEMO VIDEO DATA
========================================

পরে এই অংশটি Database/API দিয়ে
Admin Panel-এর সাথে যুক্ত করা হবে।
*/

const videos = [

    {
        id:1,
        title:"Amazing Nature Video",
        category:"Viral",
        thumbnail:"https://picsum.photos/id/1015/800/500",
        video:"https://www.w3schools.com/html/mov_bbb.mp4"
    },

    {
        id:2,
        title:"Beautiful Travel Video",
        category:"TikTok",
        thumbnail:"https://picsum.photos/id/1016/800/500",
        video:"https://www.w3schools.com/html/movie.mp4"
    },

    {
        id:3,
        title:"Funny Video",
        category:"Funny",
        thumbnail:"https://picsum.photos/id/1025/800/500",
        video:"https://www.w3schools.com/html/mov_bbb.mp4"
    }

];


let currentCategory = "All";


/* SHOW VIDEOS */

function showVideos(data){

    const list =
        document.getElementById("videoList");

    list.innerHTML = "";

    if(data.length === 0){

        list.innerHTML =
        `<div class="empty">
            😔 কোনো ভিডিও পাওয়া যায়নি
        </div>`;

        return;
    }


    data.forEach(video => {

        list.innerHTML += `

        <div class="video-card">

            <div class="thumbnail">

                <img
                src="${video.thumbnail}"
                alt="${video.title}">

                <div
                class="play"
                onclick="watchVideo('${video.video}')">

                    ▶

                </div>

            </div>


            <div class="video-info">

                <div class="video-title">
                    ${video.title}
                </div>

                <div class="video-meta">
                    📂 ${video.category}
                </div>


                <div class="action">

                    <button
                    class="btn watch"
                    onclick="watchVideo('${video.video}')">

                        ▶ Watch

                    </button>


                    <button
                    class="btn download"
                    onclick="downloadVideo('${video.video}')">

                        ⬇ Download

                    </button>

                </div>

            </div>

        </div>

        `;

    });

}


/* WATCH */

function watchVideo(url){

    const modal =
        document.getElementById("videoModal");

    const player =
        document.getElementById("player");

    player.src = url;

    modal.style.display = "flex";

}


/* CLOSE */

function closeVideo(){

    const modal =
        document.getElementById("videoModal");

    const player =
        document.getElementById("player");

    player.pause();

    player.src = "";

    modal.style.display = "none";

}


/* DOWNLOAD */

function downloadVideo(url){

    const link =
        document.createElement("a");

    link.href = url;

    link.download = "video.mp4";

    document.body.appendChild(link);

    link.click();

    link.remove();

}


/* CATEGORY */

function filterCategory(category,element){

    currentCategory = category;

    document
    .querySelectorAll(".category")
    .forEach(el =>
        el.classList.remove("active")
    );

    element.classList.add("active");

    searchVideos();

}


/* SEARCH */

function searchVideos(){

    const keyword =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    let result = videos.filter(video => {

        const categoryMatch =
            currentCategory === "All" ||
            video.category === currentCategory;

        const searchMatch =
            video.title
            .toLowerCase()
            .includes(keyword);

        return categoryMatch && searchMatch;

    });


    showVideos(result);

}


/* INITIAL */

showVideos(videos);

</script>

</body>
</html>
